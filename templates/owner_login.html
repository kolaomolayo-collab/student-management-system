<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Owner Login | Student Management System</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body class="login-page">

    <div class="login-wrapper">

        <div class="login-card">

            <div class="logo">
                SMS
            </div>

            <h1>
                Owner Login
            </h1>

            <p class="login-subtitle">
                Private administration area.
            </p>


            {% with messages = get_flashed_messages(with_categories=true) %}

                {% if messages %}

                    {% for category, message in messages %}

                        <div class="message {{ category }}">
                            {{ message }}
                        </div>

                    {% endfor %}

                {% endif %}

            {% endwith %}


            <form
                method="POST"
                action="{{ url_for('owner_login') }}"
            >

                <div class="input-group">

                    <label for="email">
                        Owner Email
                    </label>

                    <input
                        id="email"
                        type="email"
                        name="email"
                        placeholder="Owner email"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="password">
                        Owner Password
                    </label>

                    <input
                        id="password"
                        type="password"
                        name="password"
                        placeholder="Owner password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="primary-button"
                >
                    Owner Sign In
                </button>

            </form>

        </div>

    </div>

</body>

</html>

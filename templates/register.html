
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Your School | Student Management System</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="login-page">
    <div class="login-wrapper">
        <div class="login-card">

            <div class="logo">SMS</div>

            <h1>Register Your School</h1>
            <p class="login-subtitle">
                Create your school's private student management account.
            </p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="message {{ category }}">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('register') }}">

                <div class="input-group">
                    <label for="school_name">School Name</label>
                    <input
                        id="school_name"
                        type="text"
                        name="school_name"
                        placeholder="e.g. Bright Future Academy"
                        maxlength="150"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="full_name">Administrator's Full Name</label>
                    <input
                        id="full_name"
                        type="text"
                        name="full_name"
                        placeholder="Enter your full name"
                        maxlength="120"
                        autocomplete="name"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="email">Administrator's Email</label>
                    <input
                        id="email"
                        type="email"
                        name="email"
                        placeholder="you@school.com"
                        maxlength="254"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="password">Create Password</label>
                    <input
                        id="password"
                        type="password"
                        name="password"
                        placeholder="At least 8 characters"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="confirm_password">Confirm Password</label>
                    <input
                        id="confirm_password"
                        type="password"
                        name="confirm_password"
                        placeholder="Enter your password again"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <button type="submit" class="primary-button">
                    Create School Account
                </button>
            </form>

            <div class="login-note">
                Already registered?
                <a href="{{ url_for('login') }}">Sign in here</a>
            </div>

        </div>
    </div>
</body>
</html>
